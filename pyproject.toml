[project]
name = "end-to-end-ai-agent-platform"
version = "0.1.0"
description = "Reliability-oriented agentic analytics platform and empirical Text-to-SQL research pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=30.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
research = [
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]
all = [
    "end-to-end-ai-agent-platform[research,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
