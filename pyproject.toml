[project]
name = "end-to-end-ai-agent-platform"
version = "0.1.0"
description = "Production-grade agentic analytics platform vertical slice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=30.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

